  <line x1="316" y1="216" x2="296" y2="196" stroke="#141413" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="196" y1="316" x2="216" y2="296" stroke="#141413" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
