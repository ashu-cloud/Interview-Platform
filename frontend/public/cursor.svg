  <!-- Central Diamond Grounding Centroid Prism Core -->
  <polygon points="256,196 316,256 256,316 196,256" fill="#141413"/>

  <!-- Precision Core Aperture -->
  <circle cx="256" cy="256" r="16" fill="#FBF9F5"/>
  <circle cx="256" cy="256" r="7" fill="#141413"/>

