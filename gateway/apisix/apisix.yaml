routes:
  - id: 1
    uri: /api/v1/auth/*
    upstream:
      nodes:
        "job-candidate-service:8001": 1
      type: roundrobin
    plugins:
      limit-req:
        rate: 10
        burst: 5
        key: remote_addr

  - id: 2
    uri: /api/v1/*
    upstream:
      nodes:
        "job-candidate-service:8001": 1
      type: roundrobin
    plugins:
      jwt-auth: {}
      limit-req:
        rate: 100
        burst: 50
        key: remote_addr

  - id: 3
    uri: /ws/interview/*
    upstream:
      nodes:
        "interview-orchestrator:8002": 1
      type: roundrobin
    plugins:
      limit-conn:
        conn: 1000
        burst: 200
        key: remote_addr
