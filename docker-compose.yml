services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/interview_platform?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  job-candidate-service:
    build: ./services/job-candidate-service
    environment:
      PORT: 8001
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/interview_platform?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      APP_DOMAIN: http://localhost:3000
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_EMBEDDING_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-768}
      INTERVIEW_DEMO_MODE: ${INTERVIEW_DEMO_MODE:-false}
    ports:
      - "127.0.0.1:8003:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  interview-orchestrator:
    build: ./services/interview-orchestrator
    environment:
      PORT: 8002
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/interview_platform?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_AUDIO: ${MINIO_BUCKET_AUDIO:-assessment-audio}
      MINIO_USE_SSL: "false"
      JOB_CANDIDATE_SERVICE_URL: http://job-candidate-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID}
      INTERVIEW_DEMO_MODE: ${INTERVIEW_DEMO_MODE:-false}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${OPENAI_EMBEDDING_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMS: ${EMBEDDING_DIMS:-768}
      VOICE_DEBUG: ${VOICE_DEBUG:-true}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:8004:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  feedback-worker:
    build: ./services/feedback-worker
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/interview_platform?sslmode=disable
      JOB_CANDIDATE_SERVICE_URL: http://job-candidate-service:8001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      FEEDBACK_LLM_MODE: ${FEEDBACK_LLM_MODE:-groq}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'waiting for MinIO'; sleep 2; done;
      mc mb --ignore-existing local/assessment-audio;
      echo 'MinIO bucket ready';
      "

  notification-service:
    build: ./services/notification-service
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/interview_platform?sslmode=disable
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8003
        NEXT_PUBLIC_WS_URL: ws://localhost:8004
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8003
      NEXT_PUBLIC_WS_URL: ws://localhost:8004
    depends_on:
      job-candidate-service:
        condition: service_started
      interview-orchestrator:
        condition: service_started

volumes:
  pgdata:
  minio_data:
